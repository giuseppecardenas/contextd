[providers]
# Inference provider per call-site. Each independently picks "gemini" or
# "openai_compat:<profile>", where <profile> names a
# [providers.openai_compat.<profile>] table below (any OpenAI-compatible
# HTTP endpoint: Ollama local or Cloud, LM Studio, vLLM, llama.cpp's server,
# LocalAI, DeepSeek, ...). Profiles may coexist and be mixed per call-site.
# The embedding provider picks "voyage" (cloud) or "openai_compat" (local
# /embeddings endpoint). Setting every call-site to "openai_compat:local"
# plus embedding = "openai_compat" runs the whole indexing pipeline offline
# with no cloud API calls.
summary = "gemini"
inference = "gemini"
translation = "gemini"
embedding = "voyage"

[providers.gemini]
model_summary = "gemma-4-31b-it"
model_inference = "gemma-4-31b-it"
model_translation = "gemma-4-31b-it"
max_retries = 5
safety_block = "BLOCK_NONE"
daily_budget = "unlimited"

[providers.openai_compat.local]
base_url = "http://localhost:11434/v1"
# Set api_key_env = "OPENAI_API_KEY" (or any env var) for servers that
# require a bearer token. Leave unset for keyless local servers.
model_summary = "qwen2.5:7b-instruct"
model_inference = "qwen2.5:14b-instruct"
model_translation = "qwen2.5:14b-instruct"
max_retries = 5
request_timeout_seconds = 120.0
json_mode = true
# temperature = 0.2  # recommended for JSON extraction; unset = server default
#                    # (applies to summary/inference; translation keeps default)

# Additional profiles may coexist; reference one per call-site as
# "openai_compat:<profile>", e.g. translation = "openai_compat:deepseek".
#
# [providers.openai_compat.deepseek]
# base_url = "https://api.deepseek.com/v1"
# api_key_env = "DEEPSEEK_API_KEY"
# model_summary = "deepseek-chat"
# model_inference = "deepseek-chat"
# model_translation = "deepseek-chat"
# temperature = 0.2
#
# [providers.openai_compat.ollama_cloud]
# base_url = "https://ollama.com/v1"
# api_key_env = "OLLAMA_API_KEY"
# model_summary = "glm-5.2"        # verify the exact id via GET https://ollama.com/v1/models
# model_inference = "glm-5.2"
# model_translation = "glm-5.2"
# temperature = 0.2
# request_timeout_seconds = 300.0  # large reasoning model; generous timeout

[providers.voyage]
model = "voyage-4-large"
max_batch_size = 128

[providers.openai_compat_embedding]
# Used only when providers.embedding = "openai_compat". Points at a local
# OpenAI-compatible /embeddings endpoint (llama.cpp server, Ollama, vLLM, ...).
base_url = "http://localhost:11434/v1"
# Leave api_key_env unset for keyless local servers; set it to an env var
# name (e.g. "OPENAI_API_KEY") for servers that require a bearer token.
# dimensions MUST match the vector-index width in the migrations (1024). The
# default model emits 1024-dim vectors and drops into the existing index;
# a different-width model requires editing the migration DDL on both backends.
model = "mxbai-embed-large"
dimensions = 1024
max_batch_size = 64
max_retries = 5
request_timeout_seconds = 120.0

# [providers.local_hf]
# Used only when providers.embedding = "local_hf" (optional extra:
# pip install 'contextd[late]'). Runs a sentence-transformers model in
# process; it is the only embedder the `late` chunking strategy accepts
# (one forward pass per parent text, per-chunk vectors pooled from token
# vectors). dimensions MUST match the vector-index width (1024): the default
# BAAI/bge-m3 emits 1024-dim vectors over an 8192-token context, while e.g.
# nomic-ai/modernbert-embed-base (768-dim) requires editing the migration DDL.
# max_context_tokens must not exceed the model's positional limit; longer
# texts are embedded in overlapping windows.
# model = "BAAI/bge-m3"
# dimensions = 1024
# device = "cpu"            # or "cuda" / "mps"
# max_context_tokens = 8192
# normalize = true
# batch_size = 8

[storage]
backend = "neo4j"

[storage.neo4j]
host = "127.0.0.1"
port = 7687
user = "neo4j"
password = "contextd"
docker_compose_file = "~/.contextd/docker-compose.yml"
memory_limit_gb = 1.0
cpu_limit = 1.0

[inference]
summary_max_words = 100
# Extra "what did you miss?" relate passes per unit. Proven recall lever
# (Microsoft GraphRAG); roughly doubles relate input spend at 1. 0 opts out.
relate_gleaning_rounds = 1

[indexer]
inference_concurrency = 8  # parallel inference calls per phase; higher uses more provider RPM
debounce_seconds = 30
git_lock_check = true
parallel_embedding_batches = 4
allowed_branches = []
incremental_workers = 4
sweep_interval_seconds = 900
sweep_rate_sections_per_second = 0.017

[mcp]
transport = "stdio"

[search]
# Ranking strategy for the `search` MCP tool. "hybrid" (default) fuses
# vector-similarity and full-text results via reciprocal rank fusion,
# degrading to full-text when no embedder is configured or the queried
# kind has no vector index. "fulltext" / "vector" force a single ranker.
mode = "hybrid"
rrf_k = 60             # RRF damping constant; larger flattens top-rank weighting
fetch_k = 50           # per-ranker candidate depth before fusion (raised to >= limit)
vector_weight = 1.0    # bias toward semantic matches
fulltext_weight = 1.0  # bias toward lexical matches
# Chunk-level retrieval. `search` queries Chunk nodes (per-corpus [chunking]
# profiles) and collapses hits to the best enclosing unit.
# chunk_profiles = ["fine", "coarse"]   # unset → every profile present in the graph
return_unit = "auto"        # "chunk" | "section" | "file" | "auto" (section if any, else file)
auto_merge_threshold = 0.5  # fraction of a parent's chunks that must hit to return the parent
window = 1                  # neighbouring chunks attached as context on each side of a hit
max_evidence_chars = 1200   # evidence text truncation per row
over_fetch_factor = 4       # k multiplier for post-filtered vector/full-text queries

[logging]
level = "info"
format = "json"
path = "~/.contextd/logs/contextd.log"
max_log_bytes = 10485760
log_backup_count = 5

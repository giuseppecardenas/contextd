# Bench spec for the minimal-notes example (`contextd bench notes`).
#
# Every note is `# Note N` followed by "Some content for note N. See
# [note-M](note-M.md)." — so anchors are the heading slugs (`note-3`) and each
# file is exactly three lines (`lines = [0, 3]` is the whole file, 0-based,
# end-exclusive).

[[queries]]
q = "note 3"
expect = [{ path = "note-3.md", anchor = "note-3", lines = [0, 3] }]

[[queries]]
q = "content for note 7"
expect = [{ path = "note-7.md", anchor = "note-7" }]

[[queries]]
q = "which note links to note-10"
# note-9.md ends with "See [note-10](note-10.md)".
expect = [{ path = "note-9.md", anchor = "note-9" }]

[[queries]]
q = "note 1"
# note-10.md both matches lexically and links back to note-1.
expect = [{ path = "note-1.md" }, { path = "note-10.md" }]

[[queries]]
q = "see note 5"
# note-4.md points at note-5; note-5.md is the note itself.
expect = [{ path = "note-4.md" }, { path = "note-5.md" }]
k = 3

[[queries]]
q = "minimal notes example for smoke-testing"
expect = [{ path = "README.md", anchor = "minimal-notes-example" }]
